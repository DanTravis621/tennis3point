</head>
<body>

  <style>
    body { margin: 0; }
    a { color: #FF4A1F; text-decoration: none; }

<div style="position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #F0EDE3; font-family: 'Space Mono', 'Courier New', monospace;">

          <line x1="820" y1="160" x2="900" y2="160"/>
        </g>
        <circle cx="916" cy="160" r="18" fill="#FF4A1F"/>
      </svg>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; border-top: 2.5px solid #12100C; padding-top: 22px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: 54px; line-height: 1; color: #12100C;">16</span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(18, 16, 12, 0.62);">Players</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: 54px; line-height: 1; color: #12100C;">3</span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(18, 16, 12, 0.62);">Hours</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: 54px; line-height: 1; color: #12100C;">15</span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(18, 16, 12, 0.62);">Min matches</span>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: 54px; line-height: 1; color: #FF4A1F;">All</span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(18, 16, 12, 0.62);">Standards welcome</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
