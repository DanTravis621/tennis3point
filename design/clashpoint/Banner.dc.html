<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #D8F651; text-decoration: none; }
    a:hover { color: #FF5A36; }
  </style>
</helmet>
<div style="position: relative; width: 1600px; height: 600px; overflow: hidden; background: #0D1211; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;">

  <svg viewBox="0 0 1600 600" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
    <g transform="translate(800 300) rotate(-14) translate(-800 -300)" fill="none" stroke="#F7F9F4" stroke-opacity="0.10" stroke-width="3">
      <rect x="180" y="-220" width="1240" height="1040"/>
      <rect x="180" y="60" width="1240" height="480"/>
      <line x1="180" y1="300" x2="1420" y2="300"/>
      <line x1="800" y1="60" x2="800" y2="540"/>
      <line x1="440" y1="-220" x2="440" y2="820"/>
      <line x1="1160" y1="-220" x2="1160" y2="820"/>
    </g>
  </svg>

  <svg viewBox="0 0 200 200" style="position: absolute; top: -54px; right: -54px; width: 260px; height: 260px;" aria-hidden="true">
    <circle cx="100" cy="100" r="96" fill="{{accent}}"/>
    <path d="M20 46 Q 96 100 20 154" fill="none" stroke="#0D1211" stroke-width="7"/>
    <path d="M180 46 Q 104 100 180 154" fill="none" stroke="#0D1211" stroke-width="7"/>
  </svg>

  <div style="position: relative; display: flex; align-items: center; gap: 72px; height: 100%; box-sizing: border-box; padding: 64px 72px;">

    <div style="display: flex; flex-direction: column; gap: 22px; flex-grow: 1;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="width: 38px; height: 4px; background: {{accent}};"></span>
        <span style="font-size: 19px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #F7F9F4;">Preston Park &middot; Brighton</span>
      </div>
      <h1 style="margin: 0; font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 158px; line-height: 0.82; letter-spacing: -0.005em; text-transform: uppercase; color: #F7F9F4;">Clash<br>Point</h1>
      <div style="display: flex; align-self: flex-start; background: {{accent}}; padding: 12px 22px 15px;">
        <span style="font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 36px; line-height: 1; letter-spacing: 0.045em; text-transform: uppercase; color: #0D1211;">Fast Four Singles</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 26px; width: 520px; flex-shrink: 0;">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; border-top: 3px solid rgba(247, 249, 244, 0.22); padding-top: 22px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 62px; line-height: 1; color: {{accent}};">3</span>
          <span style="font-size: 16px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(247, 249, 244, 0.72);">Hours</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 62px; line-height: 1; color: {{accent}};">16</span>
          <span style="font-size: 16px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(247, 249, 244, 0.72);">Players</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 62px; line-height: 1; color: {{accent}};">15</span>
          <span style="font-size: 16px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(247, 249, 244, 0.72);">Min matches</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 23px; font-weight: 700; line-height: 1.3; color: #F7F9F4; text-wrap: pretty;">Group stage, then knockout. All standards welcome.</span>
        <span style="font-size: 21px; font-weight: 500; letter-spacing: 0.03em; color: {{accent}};">[DATE] &middot; [START TIME] &middot; [PRICE]</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1600,"height":600},"accent":{"editor":"color","default":"#D8F651","options":["#D8F651","#FF5A36","#5AD1FF","#F7F9F4"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D8F651' };
  }
}
</script>
</body>
</html>
