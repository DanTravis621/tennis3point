<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #D8F651; text-decoration: none; }
    a:hover { color: #FF5A36; }
  </style>
</helmet>
<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0D1211; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;">

  <svg viewBox="0 0 1080 1920" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
    <g transform="translate(540 960) rotate(-13) translate(-540 -960)" fill="none" stroke="#F7F9F4" stroke-opacity="0.10" stroke-width="3">
      <rect x="90" y="-260" width="900" height="2440"/>
      <rect x="90" y="420" width="900" height="1080"/>
      <line x1="90" y1="960" x2="990" y2="960"/>
      <line x1="540" y1="420" x2="540" y2="1500"/>
      <line x1="270" y1="-260" x2="270" y2="2180"/>
      <line x1="810" y1="-260" x2="810" y2="2180"/>
    </g>
  </svg>

  <svg viewBox="0 0 200 200" style="position: absolute; top: 300px; right: -70px; width: 260px; height: 260px;" aria-hidden="true">
    <circle cx="100" cy="100" r="96" fill="{{accent}}"/>
    <path d="M20 46 Q 96 100 20 154" fill="none" stroke="#0D1211" stroke-width="7"/>
    <path d="M180 46 Q 104 100 180 154" fill="none" stroke="#0D1211" stroke-width="7"/>
  </svg>

  <div style="position: relative; display: flex; flex-direction: column; justify-content: space-between; height: 100%; box-sizing: border-box; padding: 120px 76px 110px;">

    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="width: 46px; height: 4px; background: {{accent}};"></span>
      <span style="font-size: 23px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #F7F9F4;">Preston Park &middot; Brighton</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 36px;">
      <h1 style="margin: 0; font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 236px; line-height: 0.82; letter-spacing: -0.005em; text-transform: uppercase; color: #F7F9F4;">Clash<br>Point</h1>
      <div style="display: flex; align-self: flex-start; background: {{accent}}; padding: 16px 30px 20px;">
        <span style="font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 50px; line-height: 1; letter-spacing: 0.045em; text-transform: uppercase; color: #0D1211;">Fast Four Singles</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="width: 14px; height: 14px; background: {{accent}}; flex-shrink: 0;"></span>
        <span style="font-size: 30px; font-weight: 500; color: #F7F9F4;">First to four games wins the set</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="width: 14px; height: 14px; background: {{accent}}; flex-shrink: 0;"></span>
        <span style="font-size: 30px; font-weight: 500; color: #F7F9F4;">Sudden-death point at deuce</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="width: 14px; height: 14px; background: {{accent}}; flex-shrink: 0;"></span>
        <span style="font-size: 30px; font-weight: 500; color: #F7F9F4;">Tie-break at three games all</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="width: 14px; height: 14px; background: {{accent}}; flex-shrink: 0;"></span>
        <span style="font-size: 30px; font-weight: 500; color: #F7F9F4;">Group stage, then knockout</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="width: 14px; height: 14px; background: {{accent}}; flex-shrink: 0;"></span>
        <span style="font-size: 30px; font-weight: 500; color: #F7F9F4;">All standards welcome</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 36px;">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; border-top: 3px solid rgba(247, 249, 244, 0.22); padding-top: 28px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 86px; line-height: 1; color: {{accent}};">3</span>
          <span style="font-size: 20px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(247, 249, 244, 0.72);">Hours</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 86px; line-height: 1; color: {{accent}};">16</span>
          <span style="font-size: 20px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(247, 249, 244, 0.72);">Players</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-family: 'Anton', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; font-size: 86px; line-height: 1; color: {{accent}};">15</span>
          <span style="font-size: 20px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(247, 249, 244, 0.72);">Minute matches</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <span style="font-size: 34px; font-weight: 700; letter-spacing: 0.02em; color: {{accent}};">[DATE] &middot; [START TIME]</span>
        <span style="font-size: 28px; font-weight: 500; color: #F7F9F4;">[PRICE] &middot; Book at [BOOKING LINK]</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1080,"height":1920},"accent":{"editor":"color","default":"#D8F651","options":["#D8F651","#FF5A36","#5AD1FF","#F7F9F4"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D8F651' };
  }
}
</script>
</body>
</html>
